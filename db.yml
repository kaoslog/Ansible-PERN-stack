---
- name: Deploy PostgreSQL Database
  hosts: tag_Name_node1
  become: yes
  vars_files:
    - secrets.yml
  
  tasks:
    - name: Install Python pip and Docker module for Ansible
      yum:
        name: python3-pip
        state: present
        
    - name: Install docker python library
      pip:
        name: 
          - urllib3==1.26.15
          - requests==2.28.2
          - docker==6.1.3
        state: present
        extra_args: --ignore-installed

    - name: Copy Database folder to Worker Node
      copy:
        src: ./todo-app-pern/student_files/todo-app-pern/database/
        dest: /home/ec2-user/database/

    - name: Build PostgreSQL Docker image
      docker_image:
        name: clarusway-postgres
        build:
          path: /home/ec2-user/database/
        source: build

    - name: Run PostgreSQL container with Volume
      docker_container:
        name: postgres_db
        image: clarusway-postgres
        state: started
        ports:
          - "5432:5432"
        env:
          POSTGRES_PASSWORD: "{{ db_password }}"
        volumes:
          - pgdata:/var/lib/postgresql/data