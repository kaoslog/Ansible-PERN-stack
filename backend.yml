---
- name: Deploy Node.js Backend
  hosts: tag_Name_node2
  become: yes
  vars_files:
    - secrets.yml
  
  tasks:
    - name: Install Python pip and Docker module for Ansible
      yum:
        name: python3-pip
        state: present
        
    - name: Install docker python library
      pip:
        name: 
          - urllib3==1.26.15
          - requests==2.28.2
          - docker==6.1.3
        state: present
        extra_args: --ignore-installed

    - name: Copy Server folder to Worker Node
      copy:
        src: ./todo-app-pern/student_files/todo-app-pern/server/
        dest: /home/ec2-user/server/

    - name: Build Node.js Docker image
      docker_image:
        name: clarusway-server
        build:
          path: /home/ec2-user/server/
        source: build

    - name: Run Node.js container
      docker_container:
        name: node_backend
        image: clarusway-server
        state: started
        ports:
          - "5000:5000"
        env:
          DB_USER: "postgres"
          DB_PASSWORD: "{{ db_password }}"
          DB_HOST: "{{ hostvars[groups['tag_Name_node1'][0]]['private_ip_address'] }}"
          DB_NAME: "clarustodo"
          DB_PORT: "5432"
