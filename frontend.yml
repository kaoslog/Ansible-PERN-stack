---
- name: Deploy React Frontend
  hosts: tag_Name_node3__ubuntu_
  remote_user: ubuntu
  become: yes
  
  tasks:
    - name: Update apt cache and install Python pip
      apt:
        name: python3-pip
        update_cache: yes
        state: present
        
    - name: Install docker python library
      pip:
        name: 
          - urllib3==1.26.15
          - requests==2.28.2
          - docker==6.1.3
        state: present
        extra_args: --ignore-installed --break-system-packages

    - name: Copy Client folder to Worker Node
      copy:
        src: ./todo-app-pern/student_files/todo-app-pern/client/
        dest: /home/ubuntu/client/

    - name: Build React Docker image
      docker_image:
        name: clarusway-client
        build:
          path: /home/ubuntu/client/
        source: build

    - name: Run React container
      docker_container:
        name: react_frontend
        image: clarusway-client
        state: started
        ports:
          - "3000:3000"
        env:
          REACT_APP_BASE_URL: "http://{{ hostvars[groups['tag_Name_node2'][0]]['public_ip_address'] }}:5000/"